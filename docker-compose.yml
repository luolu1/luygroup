services:
  groupguard:
    build: .
    image: groupguard:latest
    container_name: groupguard
    environment:
      GROUPGUARD_CONFIG: /app/config.json
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      # Real configuration stays on the host. Read-only inside the container.
      - ./config.json:/app/config.json:ro
      # SQLite database persists across container rebuilds.
      - ./data:/app/data
    ports:
      - "${WEB_PORT:-8090}:8090"
    restart: unless-stopped
    stop_grace_period: 15s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
